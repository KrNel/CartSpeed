name: CartSpeed
version: '${project.version}'
main: dev.cartspeed.CartSpeedPlugin
api-version: '26.1'
description: Sets how fast plain minecarts can go, lets empty ones coast like full ones, and makes lava cauldrons break minecarts again.

commands:
  cartspeed:
    description: Show CartSpeed's settings, or reload them from config.yml.
    usage: /<command> [reload]
    permission: cartspeed.admin

permissions:
  cartspeed.admin:
    description: Show and reload CartSpeed's settings.
    default: op
